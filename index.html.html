<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climate Alarm</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#101820;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#card{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);width:min(340px,90vw);padding:20px;border-radius:26px;text-align:center;background:rgba(10,18,32,.38);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
#lay{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#e3f1ff;margin-bottom:8px;text-shadow:0 1px 6px #000}
#ring{position:relative;width:220px;height:220px;margin:0 auto;max-width:62vw;max-height:62vw}
#ring svg{width:100%;height:100%;transform:rotate(-90deg)}
#tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#t{font-size:clamp(44px,13vw,58px);font-weight:200;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.5)}
#st{font-size:12px;color:#e3f1ff;min-height:16px}
#inf{font-size:12px;color:#eef6ff;margin:10px 0;text-shadow:0 1px 6px #000}
#mins{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
#mins button{flex:0 0 auto;width:40px;padding:8px 0;font-size:13px}
#mins button.on{background:rgba(255,255,255,.4);border-color:#fff}
#btns{display:flex;gap:8px}
button{flex:1;padding:11px 0;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
button:active{transform:scale(.96)}
#go{background:rgba(70,150,255,.6);border-color:rgba(150,200,255,.8)}
.done #t{color:#ffb4a0;animation:sh .5s infinite}.done #card{border-color:#ff8c6e;box-shadow:0 0 50px rgba(255,100,70,.55)}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style></head><body>
<canvas id="c"></canvas>
<main id="card">
 <div id="lay">Sunny</div>
 <div id="ring"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="108" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="5"/><circle id="arc" cx="120" cy="120" r="108" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="678.6" stroke-dashoffset="0"/></svg>
 <div id="tm"><div id="t">05:00</div><div id="st">Ready</div></div></div>
 <div id="inf"></div>
 <div id="mins"></div>
 <div id="btns"><button id="go">Start</button><button id="stop">Stop</button><button id="rst">Reset</button></div>
</main>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id),TAU=Math.PI*2;
let DUR=5*60000,state='idle',acc=0,t0=0,ac=null,ringT=null,W,H,T=0,lastT='',lastS='',flash=0,bolt=null;
const sm=(x,a,b)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)},rnd=(a,b)=>a+Math.random()*(b-a);
const elapsed=()=>state==='running'?acc+Date.now()-t0:acc;
/* ---- minutes selector (1-5) ---- */
[1,2,3,4,5].forEach(m=>{const b=document.createElement('button');b.textContent=m;b.dataset.m=m;if(m===5)b.className='on';
  b.onclick=()=>{if(state==='running')return;DUR=m*60000;acc=0;state='idle';silence();document.querySelectorAll('#mins button').forEach(x=>x.className=x===b?'on':'')};$('mins').appendChild(b)});
/* ---- alarm ---- */
function beep(f,t,d){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.01);g.gain.setValueAtTime(.22,t+d-.03);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function ring(){if(!ac)return;const t=ac.currentTime;[0,.25,.5].forEach(o=>beep(988,t+o,.15));beep(740,t+.78,.3);navigator.vibrate&&navigator.vibrate([250,120,250])}
function startAlarm(){document.body.classList.add('done');document.title='⏰ Time\u2019s up!';ring();ringT=setInterval(ring,1600)}
function silence(){clearInterval(ringT);ringT=null;document.body.classList.remove('done');document.title='Climate Alarm'}
function pauseClock(){if(state==='running')acc+=Date.now()-t0}
$('go').onclick=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();
  if(state==='done'){silence();acc=0;state='idle'}
  if(state==='running'){pauseClock();state='paused'}else{t0=Date.now();state='running'}};
$('stop').onclick=()=>{pauseClock();if(state!=='idle')state='stopped';silence()};
$('rst').onclick=()=>{silence();acc=0;state='idle'};
/* ---- climates: [topRGB, botRGB, sun, cloud, dark, rain, storm, snow, temp] ---- */
const names=['Sunny','Cloudy','Rainy','Thunderstorm','Snowfall'];
const P=[[60,130,215,190,225,250,1,.15,0,0,0,0,32],[100,125,160,185,200,215,.2,.8,.2,0,0,0,26],[60,75,100,130,145,165,0,1,.5,1,0,0,22],[25,30,50,70,78,100,0,1,.85,1,1,0,19],[150,170,200,225,235,245,0,.9,.1,0,0,1,-2]];
function mix(p){const x=Math.min(4.999,p*5),i=Math.floor(x),t=sm(x-i,.65,1),a=P[i],b=P[Math.min(4,i+1)];return{v:a.map((v,j)=>v+(b[j]-v)*t),i:t>.5&&i<4?i+1:i}}
const rgb=(a,o)=>`rgb(${a[o]|0},${a[o+1]|0},${a[o+2]|0})`;
const rain=Array.from({length:450},()=>({x:Math.random(),y:Math.random(),v:rnd(.9,1.6)}));
const snow=Array.from({length:260},()=>({x:Math.random(),y:Math.random(),v:rnd(.05,.14),ph:rnd(0,6.3),r:rnd(1.2,3.2)}));
const cl=Array.from({length:14},()=>({x:Math.random(),y:rnd(.04,.38),s:rnd(.7,1.5),v:rnd(.004,.012)}));
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);
function puff(x,y,s,sh){for(let k=0;k<6;k++){const px=x+(k-2.5)*38*s,py=y+Math.sin(k*1.7)*10*s,r=(46-Math.abs(k-2.5)*6)*s;const g=ctx.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(${sh},${sh},${sh+8},.85)`);g.addColorStop(1,`rgba(${sh},${sh},${sh+8},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,r,0,TAU);ctx.fill()}}
function draw(dt,p,m){
  const v=m.v,[sun,cloud,dark,rn,st,sn]=v.slice(6,12),hy=H*.8;
  let g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,rgb(v,0));g.addColorStop(1,rgb(v,3));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(sun>.01){ctx.globalCompositeOperation='lighter';const sx=W*.75,sy=H*.2;g=ctx.createRadialGradient(sx,sy,0,sx,sy,260);g.addColorStop(0,`rgba(255,248,225,${.95*sun})`);g.addColorStop(.12,`rgba(255,225,150,${.5*sun})`);g.addColorStop(1,'rgba(255,200,120,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over'}
  const sh=255-dark*150|0,n=Math.ceil(cl.length*cloud);
  for(let i=0;i<n;i++){const c=cl[i];c.x+=c.v*dt*(1+st*2);if(c.x>1.3)c.x=-.3;puff(c.x*W,c.y*H+Math.sin(T*.3+i)*4,c.s*(1+dark*.4),sh)}
  // ground
  const gc=[lerp(70,240,sn),lerp(135,245,sn),lerp(75,250,sn)].map(x=>x*(1-st*.35));
  g=ctx.createLinearGradient(0,hy,0,H);g.addColorStop(0,`rgb(${gc[0]|0},${gc[1]|0},${gc[2]|0})`);g.addColorStop(1,`rgb(${gc[0]*.6|0},${gc[1]*.6|0},${gc[2]*.65|0})`);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=20)ctx.lineTo(x,hy+Math.sin(x*.01)*14+Math.sin(x*.027)*6);ctx.lineTo(W,H);ctx.fill();
  // rain
  if(rn>.01){ctx.strokeStyle=`rgba(190,215,255,${.55*rn})`;ctx.lineWidth=1.2;ctx.beginPath();const k=Math.floor(rain.length*(.45+.55*st)*rn);const sl=14+st*10;
    for(let i=0;i<k;i++){const r=rain[i];r.y+=r.v*dt*(1.1+st*.5);if(r.y>1){r.y=-.05;r.x=Math.random()}const x=r.x*W,y=r.y*H;ctx.moveTo(x,y);ctx.lineTo(x-sl*.3,y+sl*1.6)}ctx.stroke()}
  // snow
  if(sn>.01){ctx.fillStyle=`rgba(255,255,255,${.9*sn})`;const k=Math.floor(snow.length*sn);for(let i=0;i<k;i++){const s=snow[i];s.y+=s.v*dt;if(s.y>1){s.y=-.03;s.x=Math.random()}ctx.beginPath();ctx.arc((s.x+Math.sin(T+s.ph)*.015)*W,s.y*H,s.r,0,TAU);ctx.fill()}}
  // lightning
  if(st>.5&&Math.random()<.008){flash=1;let x=rnd(.2,.8)*W,y=0;bolt=[[x,y]];while(y<hy){y+=rnd(25,50);x+=rnd(-30,30);bolt.push([x,y])}}
  if(flash>0){ctx.fillStyle=`rgba(230,235,255,${flash*.5})`;ctx.fillRect(0,0,W,H);if(bolt&&flash>.4){ctx.strokeStyle=`rgba(255,255,255,${flash})`;ctx.lineWidth=3;ctx.beginPath();bolt.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()}flash-=dt*3}
  g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.4)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(state==='done'){ctx.fillStyle=`rgba(255,80,50,${.1+.1*Math.sin(T*8)})`;ctx.fillRect(0,0,W,H)}
}
const lerp=(a,b,t)=>a+(b-a)*t;
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  let e=Math.min(DUR,elapsed());if(state==='running'&&e>=DUR){acc=DUR;e=DUR;state='done';startAlarm()}
  const p=e/DUR,rem=Math.ceil((DUR-e)/1000),m=mix(p);
  const ts=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');
  if(ts!==lastT){$('t').textContent=ts;lastT=ts}
  const S={idle:'Ready',running:'Climate changing…',paused:'Paused',stopped:'Stopped',done:'⏰ Time\u2019s up!'}[state];
  if(S!==lastS){$('st').textContent=S;lastS=S;$('go').textContent=state==='running'?'Pause':state==='paused'||state==='stopped'?'Resume':'Start'}
  $('arc').style.strokeDashoffset=678.6*p;
  $('lay').textContent=names[m.i];
  $('inf').textContent=`${m.v[12].toFixed(0)} °C · ${names[m.i]}`;
  draw(dt,p,m);requestAnimationFrame(frame);
}
resize();requestAnimationFrame(frame);
</script></body></html>
